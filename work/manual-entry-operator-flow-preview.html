  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        typeof data !== &quot;object&quot; ||

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;sfts-manual-flow&quot;);
      const state = { step: 0, compact: false, categoryDeleted: false };
      const labels = [&quot;Category&quot;, &quot;Bout&quot;, &quot;Competitors&quot;, &quot;Review &amp; load&quot;];
      const screens = [...root.querySelectorAll(&quot;.screen&quot;)];
      const steps = [...root.querySelectorAll(&quot;.step&quot;)];
      const back = root.querySelector(&quot;#mock-back&quot;);
      const next = root.querySelector(&quot;#mock-next&quot;);
      const status = root.querySelector(&quot;#mock-status&quot;);
      const deleteButton = root.querySelector(&quot;#mock-delete-category&quot;);
      const deleteDialog = root.querySelector(&quot;#mock-delete-confirm&quot;);
      const categoryState = root.querySelector(&quot;#mock-category-state&quot;);

      function render() {
        screens.forEach((screen, index) =&gt; screen.classList.toggle(&quot;active&quot;, index === state.step));
        steps.forEach((step, index) =&gt; {
          step.classList.toggle(&quot;active&quot;, index === state.step);
          step.classList.toggle(&quot;done&quot;, index &lt; state.step);
        });
        back.disabled = state.step === 0 || state.step === 4;
        next.disabled = state.step === 0 &amp;&amp; state.categoryDeleted;
        next.style.display = state.step === 4 ? &quot;none&quot; : &quot;inline-block&quot;;
        next.textContent = state.step === 3
          ? (root.querySelector(&quot;#mock-announce&quot;).checked ? &quot;Load &amp; announce&quot; : &quot;Load bout&quot;)
          : &quot;Continue&quot;;
        status.textContent = state.categoryDeleted &amp;&amp; state.step === 0
          ? &quot;Category deleted · Select another category or create a new one&quot;
          : state.step === 4
            ? &quot;Loaded · Ready for scoreboard&quot;
            : `Step ${state.step + 1} of 4 · ${labels[state.step]}`;
        deleteButton.disabled = state.categoryDeleted;
        deleteButton.textContent = state.categoryDeleted ? &quot;Category deleted&quot; : &quot;Delete category&quot;;
        categoryState.innerHTML = state.categoryDeleted
          ? &quot;&lt;span&gt;Category removed&lt;/span&gt;&lt;span&gt;Select another category&lt;/span&gt;&quot;
          : &quot;&lt;span&gt;&lt;strong&gt;OPEN&lt;/strong&gt; · 0 completed bouts&lt;/span&gt;&lt;span&gt;Safe to delete&lt;/span&gt;&quot;;
        root.classList.toggle(&quot;compact&quot;, state.compact);
      }

      back.addEventListener(&quot;click&quot;, () =&gt; { if (state.step &gt; 0) { state.step -= 1; render(); } });
      next.addEventListener(&quot;click&quot;, () =&gt; { if (state.step &lt; 4) { state.step += 1; render(); } });
      root.querySelector(&quot;#mock-announce&quot;).addEventListener(&quot;change&quot;, render);
      deleteButton.addEventListener(&quot;click&quot;, () =&gt; { deleteDialog.hidden = false; });
      root.querySelector(&quot;#mock-delete-cancel&quot;).addEventListener(&quot;click&quot;, () =&gt; { deleteDialog.hidden = true; });
      root.querySelector(&quot;#mock-delete-confirm-button&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        state.categoryDeleted = true;
        root.querySelector(&quot;#mock-category-select&quot;).innerHTML = &quot;&lt;option&gt;No category selected&lt;/option&gt;&quot;;
        deleteDialog.hidden = true;
        render();
      });
      render();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addToggle(state, &quot;compact&quot;, { label: &quot;Compact spacing&quot;, reference: &quot;manual-entry.compact&quot; });
      }
    })();
  &lt;/script&gt;

  const tooltipId = `codex-visualization-tooltip-${
